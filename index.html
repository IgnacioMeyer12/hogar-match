<style>
:root{--red:#1e63d6;--org:#1e63d6;--yel:#38a8f0;--cream:#fff8ee;--ink:#2b1a14;--mut:#8a6f63;--line:#f1dfc9;--card:#fff;--ok:#b45309;--g:linear-gradient(135deg,#1e63d6,#1e63d6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 30% 20%,#7a1a0d,#2b1a14 70%);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.logo{font-family:Georgia,"Times New Roman",serif;margin:0}
#phone{width:400px;height:820px;max-width:100%;max-height:calc(100vh - 32px);background:var(--cream);border:11px solid #0e0907;border-radius:44px;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 30px 80px #000a,0 0 0 2px #4a2c20}
#phone::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:110px;height:22px;background:#0e0907;border-radius:0 0 16px 16px;z-index:20}
#top{padding:30px 14px 10px;background:var(--g);color:#fff;display:flex;align-items:center;gap:8px}
#top .logo{font-size:20px;flex:1}#top .logo i{font-style:normal;color:var(--yel)}
.ib{background:#fff3;border:0;color:#fff;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:15px;position:relative}.ib b{position:absolute;top:-3px;right:-3px;background:var(--yel);color:var(--ink);border-radius:10px;font-size:10px;padding:0 5px}
#main{flex:1;overflow:auto;padding:14px}#nav{display:flex;border-top:1px solid var(--line);background:#fff;padding-bottom:4px}
#nav button{flex:1;border:0;background:none;padding:8px 0 4px;color:var(--mut);font-size:10.5px;cursor:pointer}#nav button.on{color:var(--red);font-weight:700}#nav span{display:block;font-size:19px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px #1e63d60a}
.hero{background:var(--g);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}.hero p{margin:4px 0 0;opacity:.92}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;width:100%;font-size:14px;box-shadow:0 4px 12px #1e63d633}.btn.s{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.y{background:var(--yel);color:var(--ink);box-shadow:none}.btn:disabled{opacity:.4}.btn.sm{width:auto;padding:6px 11px;font-size:12px;border-radius:9px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;margin:4px 0 8px}input:focus,textarea:focus{outline:2px solid var(--yel)}

function choose(id){const q=S.quotes.find(x=>x.p.id==id);modal(`<b>Confirmar selección</b><p>${q.p.n} · ${money(q.price)}.<br><span class="mut">La selección es definitiva: se rechazarán automáticamente las demás cotizaciones (RN-09).</span></p><button class="btn" onclick="confirmSel(${id})">Confirmar</button><button class="btn s" style="margin-top:6px" onclick="closeM()">Cancelar</button>`)}
function confirmSel(id){const q=S.quotes.find(x=>x.p.id==id),r=S.reqs.find(x=>x.id==S.cur),n=S.quotes.length-1;stopT();Object.assign(r,{st:"asignada",pro:id,price:q.price});r.act.push(`Cotización de ${q.p.n} aceptada`,`${n} cotizaciones rechazadas automáticamente`);r.chat=[["p","¡Hola! Gracias por elegirme. ¿Cuándo te viene bien que pase?",hm()]];
lg("App","API","PATCH /cotizaciones/"+id+"/aceptar");lg("API","PostgreSQL","solicitud = asignada; cotización = aceptada");lg("API","PostgreSQL","Demás cotizaciones = rechazada");lg("API","FCM","Push al profesional seleccionado");lg("API","FCM","Push a "+n+" no seleccionados");S.modal="";toast("Selección confirmada. Ya podés chatear con "+q.p.n.split(" ")[0],1);go("det")}
function direct(id){const r=newReq("pendiente");r.pro=id;const p=PROS.find(x=>x.id==id);r.act.push("Enviada a "+p.n+" (pendiente de aceptación)");lg("App","API","POST /solicitudes/directa");lg("API","FCM","Push nueva solicitud → "+p.n);go("sent");setTimeout(()=>{if(r.st=="pendiente"){r.st="asignada";r.price=Math.round(r.base*p.f/500)*500;r.act.push(p.n+" aceptó la solicitud");r.chat.push(["p","Recibí tu solicitud, puedo ir mañana.",hm()]);toast(p.n+" aceptó tu solicitud",1);S.screen=="sent"&&R()}},4500)}
function openChat(id,b){S.cur=id;S.back=b;go("chat")}
function send(){const i=$("#cm"),v=i.value.trim();if(!v)return;msg(v)}
function attach(){msg("‹camera› foto_adjunta.jpg")}
function msg(v){const r=S.reqs.find(x=>x.id==S.cur),pro=S.role=="pro";r.chat.push([pro?"p":"c",v,hm()]);R();setTimeout(()=>{if(S.screen=="chat"&&S.cur==r.id){r.chat.push([pro?"c":"p",["Perfecto, quedamos así.","Sí, sin problema. ¿Podés mandarme una foto?","Genial, nos vemos entonces"][r.chat.length%3],hm()]);R()}},1400)}
function finish(id){const r=S.reqs.find(x=>x.id==id);r.st="finalizada";r.act.push("Servicio finalizado");lg("API","PostgreSQL","solicitud = finalizada");lg("API","FCM","Push a ambas partes: valorar");toast("Servicio finalizado. ¡Valorá la experiencia!",1);R()}
function proDone(id){finish(id)}
function cancelAsk(id){modal(`<b>¿Cancelar la solicitud?</b><p class="mut">Se notificará al profesional asociado.</p><button class="btn" onclick="cancelReq('${id}')">Sí, cancelar</button><button class="btn s" style="margin-top:6px" onclick="closeM()">No, mantener</button>`)}
function cancelReq(id){const r=S.reqs.find(x=>x.id==id);r.st="cancelada";r.act.push("Cancelada por el cliente");stopT();lg("App","API","PATCH /solicitudes/"+id+"/cancelar");S.modal="";toast("Solicitud cancelada");go("det")}
let rc={};const DIM={c:["Puntualidad","Calidad del trabajo","Transparencia del presupuesto","Trato"],p:["Claridad de la información","Condiciones de acceso al domicilio","Trato"]};
function rateForm(id,w){if(!S.rmeta||S.rmeta.id!=id)rc={};S.rmeta={id,w};modal(`<b>${w=="c"?"Valorar al profesional":"Valorar al cliente"}</b>${DIM[w].map(d=>`<div class="row sp" style="margin:6px 0"><span>${d}</span><span class="stars">${[1,2,3,4,5].map(i=>`<span class="${i<=(rc[d]||0)?"on":""}" onclick="rc['${d}']=${i};rateForm('${id}','${w}')">★</span>`).join("")}</span></div>`).join("")}<textarea id="rcm" rows="2" placeholder="Comentario (opcional)"></textarea><button class="btn" onclick="rateSend()">Enviar valoración</button>`)}
function rateSend(){const{id,w}=S.rmeta;if(Object.keys(rc).length<DIM[w].length)return toast("Puntuá todas las dimensiones");const r=S.reqs.find(x=>x.id==id);w=="c"?r.rated=true:r.ratedPro=true;r.act.push("Valoración registrada ("+(w=="c"?"cliente → profesional":"profesional → cliente")+")");lg("App","API","POST /valoraciones");lg("API","PostgreSQL","INSERT valoración; recalcula reputación");rc={};S.modal="";toast("¡Gracias! Reputación actualizada");R()}
function quoteForm(id){const o=OPP().find(x=>x.id==id);if(o.exp)return toast("La ventana de licitación ya expiró: no admite cotizaciones");modal(`<b>Cotizar: ${o.title}</b>${oBody(o)}${o.ref?`<p class="mut">Referencia de la IA: ${o.ref}</p>`:""}<label>Monto (ARS)</label><input id="qm" type="number" placeholder="Ej: 38000"><button class="btn" onclick="sendQ('${id}')">Enviar cotización</button><button class="btn s" style="margin-top:6px" onclick="closeM()">Cancelar</button>`)}
function sendQ(id){const m=+$("#qm").value,o=OPP().find(x=>x.id==id);if(!(m>0))return toast("El monto debe ser mayor a 0");if(S.myq.some(q=>q.id==id))return toast("RN-08: ya cotizaste esta solicitud");S.myq.unshift({id,title:o.title,m,st:"pendiente"});lg("Profesional","API","POST /cotizaciones");lg("API","PostgreSQL","INSERT cotización (pendiente)");lg("API","FCM","Push nueva cotización → Cliente");
if(S.pubReq&&id==S.pubReq.id){S.pend=S.pend.filter(x=>x.p.id!=S.me);S.quotes=S.quotes.filter(x=>x.p.id!=S.me);S.quotes.push({p:ME(),at:0,price:m})}S.modal="";toast("Cotización enviada. El cliente fue notificado");R()}
function traza(){modal(`<b>‹gear› Traza técnica</b><p class="mut">Mensajes entre componentes (App Flutter · API NestJS · Cloudinary · OpenAI · PostgreSQL · FCM), según los diagramas de secuencia.</p>${S.log.slice(-40).reverse().map(l=>`<div class="lg">${l[0]} <b>${l[1]}</b> → <b>${l[2]}</b><br>${l[3]}</div>`).join("")||`<p class="mut">Todavía no hay eventos.</p>`}<button class="btn" style="margin-top:10px" onclick="closeM()">Cerrar</button>`)}
init();
</script></body></html>
